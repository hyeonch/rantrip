<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Subway Trip</title>
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: #F0F2F4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── App Shell ── */
  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg-surface);
    overflow: hidden;
  }

  /* ── Header ── */
  .app-header {
    padding: 80px 24px 16px;
    background: #fff;
    border-bottom: 1px solid var(--border-default);
    flex-shrink: 0;
  }
  .header-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--primary-600);
    margin-bottom: 6px;
    font-family: var(--font-numeric);
  }
  .header-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 60px;
    line-height: 1.0;
    letter-spacing: -0.05em;
    color: var(--fg-primary);
  }
  .header-title span {
    color: var(--primary-600);
  }

  /* ── Scrollable Main ── */
  .app-main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Section Label ── */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-tertiary);
    margin-bottom: 8px;
  }

  /* ── Input Card ── */
  .input-card {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-1);
  }
  .input-card-label {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg-primary);
    margin-bottom: 12px;
  }
  .input-wrap {
    position: relative;
  }
  .station-input {
    width: 100%;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 15px;
    font-family: var(--font-sans);
    font-weight: 500;
    color: var(--fg-primary);
    background: #fff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .station-input:focus {
    border-color: var(--primary-600);
    box-shadow: 0 0 0 3px var(--primary-200);
  }
  .station-input::placeholder {
    color: var(--fg-disabled);
    font-weight: 400;
  }
  .station-input--error {
    border-color: var(--danger-600) !important;
    box-shadow: 0 0 0 3px var(--danger-200) !important;
    animation: shake 0.4s ease-out forwards;
  }

  /* ── Autocomplete ── */
  .autocomplete {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    list-style: none;
    overflow: hidden;
    z-index: 20;
    box-shadow: var(--shadow-2);
  }
  .autocomplete li {
    padding: 11px 14px;
    font-size: 14px;
    cursor: pointer;
    color: var(--fg-secondary);
    transition: background 0.1s;
  }
  .autocomplete li:not(:last-child) {
    border-bottom: 1px solid var(--border-default);
  }
  .autocomplete li:hover,
  .autocomplete li.active {
    background: var(--primary-200);
    color: var(--primary-700);
  }
  .autocomplete li mark {
    background: none;
    color: var(--primary-600);
    font-weight: 700;
  }

  /* ── Primary Button ── */
  .btn-primary {
    width: 100%;
    background: var(--primary-600);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    padding: 13px 20px;
    font-size: 15px;
    font-family: var(--font-sans);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-700);
    transform: translateY(-1px);
  }
  .btn-primary:disabled {
    background: var(--neutral-200);
    color: var(--fg-disabled);
    cursor: not-allowed;
    transform: none;
  }

  /* ── Ghost Button ── */
  .btn-ghost {
    width: 100%;
    background: transparent;
    color: var(--fg-secondary);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 12px 20px;
    font-size: 15px;
    font-family: var(--font-sans);
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-ghost:hover {
    border-color: var(--primary-600);
    color: var(--primary-600);
    background: var(--primary-50);
  }

  /* ── Step Cards ── */
  .step-card {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-1);
    border: 1.5px solid var(--border-default);
    animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .step-card--active {
    border-color: var(--step-color, var(--primary-600));
    box-shadow: 0 0 0 1px var(--step-color, var(--primary-600)), var(--shadow-1);
  }
  .step-card--done {
    opacity: 0.55;
  }
  .step-card--destination {
    background: var(--primary-600);
    border-color: var(--primary-600);
    box-shadow: 0 4px 24px rgba(21,197,206,0.28);
  }
  .step-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--step-color, var(--primary-600));
  }
  .step-card--destination .step-eyebrow {
    color: rgba(255,255,255,0.7);
  }
  .step-value {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--fg-primary);
  }
  .step-card--destination .step-value {
    color: #fff;
    font-size: 34px;
  }
  .step-sub {
    font-size: 12px;
    color: var(--fg-tertiary);
    margin-top: 2px;
  }
  .step-card--destination .step-sub {
    color: rgba(255,255,255,0.65);
  }

  /* ── Line Badge ── */
  .line-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    margin-top: 8px;
    width: fit-content;
  }
  .line-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* ── Direction Extras ── */
  .direction-extras {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    box-shadow: var(--shadow-1);
    border: 1px solid var(--border-default);
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .direction-counts {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .direction-stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .direction-stat-label {
    font-size: 11px;
    color: var(--fg-tertiary);
    font-weight: 500;
  }
  .direction-stat-value {
    font-family: var(--font-numeric);
    font-size: 18px;
    font-weight: 700;
    color: var(--fg-primary);
  }
  .direction-divider {
    width: 1px;
    height: 32px;
    background: var(--border-default);
    margin: 0 16px;
  }
  .maxstops-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .maxstops-label {
    font-size: 13px;
    color: var(--fg-secondary);
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .maxstops-input {
    flex: 1;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 14px;
    font-family: var(--font-numeric);
    color: var(--fg-primary);
    background: var(--bg-surface);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .maxstops-input:focus {
    border-color: var(--primary-600);
    box-shadow: 0 0 0 3px var(--primary-200);
  }
  .maxstops-input::placeholder {
    color: var(--fg-disabled);
    font-size: 12px;
  }

  /* ── Final State ── */
  .final-msg {
    text-align: center;
    padding: 8px 0 4px;
    font-size: 14px;
    color: var(--fg-tertiary);
  }
  .final-msg strong {
    color: var(--primary-600);
    font-weight: 700;
  }

  /* ── Destination Screen ── */
  .dest-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 40px 28px 60px;
    overflow: hidden;
  }

  /* 지하철 문 — 두 패널이 양쪽으로 열림 */
  .door-left,
  .door-right {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    z-index: 200;
    animation: doorOpen 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.1s both;
  }
  .door-left  { left: 0;  transform-origin: left center; }
  .door-right { right: 0; transform-origin: right center; }

  @keyframes doorOpen {
    0%   { transform: scaleX(1); opacity: 1; }
    70%  { transform: scaleX(0); opacity: 1; }
    100% { transform: scaleX(0); opacity: 0; pointer-events: none; }
  }

  /* 문 안쪽 선 디테일 */
  .door-inner-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: rgba(0,0,0,0.15);
  }
  .door-left  .door-inner-line { right: 0; }
  .door-right .door-inner-line { left: 0; }

  /* 컨텐츠는 살짝 늦게 페이드인 */
  .dest-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: destFadeIn 0.5s ease 0.55s both;
  }
  @keyframes destFadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  .dest-eyebrow {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 16px;
    font-family: var(--font-numeric);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .dest-station {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 64px;
    line-height: 1.0;
    letter-spacing: -0.04em;
    color: #fff;
    text-align: center;
    text-shadow: 0 4px 32px rgba(0,0,0,0.18);
    margin-bottom: 16px;
  }
  .dest-line-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: var(--radius-full);
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(8px);
    margin-bottom: 48px;
  }
  .dest-again-btn {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: var(--radius-md);
    padding: 13px 32px;
    font-size: 15px;
    font-family: var(--font-sans);
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dest-again-btn:hover {
    background: rgba(255,255,255,0.32);
  }

  /* confetti */
  .confetti-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Tag ── */
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
    background: var(--warning-100);
    color: var(--warning-700);
  }
  .tag--info {
    background: var(--primary-100);
    color: var(--primary-700);
  }

  /* ── Animations ── */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%   { transform: translateX(0); }
    15%  { transform: translateX(-6px); }
    35%  { transform: translateX(6px); }
    55%  { transform: translateX(-3px); }
    75%  { transform: translateX(3px); }
    100% { transform: translateX(0); }
  }
</style>

<script type="text/babel" data-plugins="transform-react-jsx-source,om-src-id,om-text-extract" data-filename="inline-1">
const { useState, useRef, useEffect } = React;

/* ── stations data loader ── */
let stationsCache = null;
async function loadStations() {
  if (stationsCache) return stationsCache;
  const res = await fetch('stations.json');
  stationsCache = await res.json();
  return stationsCache;
}

/* ── subway utils (ported from subway.js) ── */
function buildIndex(data) {
  const idx = {};
  Object.entries(data.lines).forEach(([lineId, lineData]) => {
    lineData.stations.forEach((station, i) => {
      if (station.order % 1 !== 0) return;
      if (!idx[station.name]) idx[station.name] = {};
      idx[station.name][lineId] = i;
    });
  });
  return idx;
}

function getAllStationNames(idx) {
  return Object.keys(idx).sort();
}

function pickRandomLine(data) {
  const ids = Object.keys(data.lines);
  return ids[Math.floor(Math.random() * ids.length)];
}

function findNearestStation(name, lineId, idx, data) {
  const stationInfo = idx[name];
  const lineStations = data.lines[lineId].stations;
  if (stationInfo?.[lineId] !== undefined) return { name, matched: true };
  if (!stationInfo) return { name: lineStations[0].name, matched: false };
  let nearest = null, minDist = Infinity;
  Object.entries(idx).forEach(([n, lines]) => {
    if (lines[lineId] === undefined) return;
    Object.entries(stationInfo).forEach(([dLineId, dIdx]) => {
      if (lines[dLineId] === undefined) return;
      const dist = Math.abs(lines[dLineId] - dIdx);
      if (dist < minDist) { minDist = dist; nearest = n; }
    });
  });
  if (nearest) return { name: nearest, matched: false };
  const [depLineId, depIdx] = Object.entries(stationInfo)[0];
  const pos = depIdx / Math.max(data.lines[depLineId].stations.length - 1, 1);
  const tIdx = Math.round(pos * (lineStations.length - 1));
  return { name: lineStations[tIdx].name, matched: false };
}

function getDirectionStats(lineId, boardingName, data) {
  const stations = data.lines[lineId].stations;
  const bi = stations.findIndex(s => s.name === boardingName);
  return { upCount: bi, downCount: stations.length - bi - 1 };
}

function pickDestination(lineId, boardingName, direction, maxStops, data) {
  const stations = data.lines[lineId].stations;
  const bi = stations.findIndex(s => s.name === boardingName);
  let candidates = direction === 'up' ? stations.slice(0, bi) : stations.slice(bi + 1);
  if (candidates.length === 0)
    candidates = direction === 'up' ? stations.slice(bi + 1) : stations.slice(0, bi);
  if (maxStops && maxStops > 0 && maxStops < candidates.length)
    candidates = direction === 'up' ? candidates.slice(-maxStops) : candidates.slice(0, maxStops);
  return candidates[Math.floor(Math.random() * candidates.length)];
}

/* ── Korean chosung autocomplete ── */
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JAMO_SET = new Set('ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ');
function extractChosung(str) {
  return [...str].map(ch => {
    const c = ch.charCodeAt(0);
    return (c >= 0xAC00 && c <= 0xD7A3) ? CHOSUNG[(c - 0xAC00) / 588 | 0] : ch;
  }).join('');
}
function getMatches(query, allStations) {
  if (!query) return [];
  const q = query.replace(/역$/, '');
  if (!q) return [];
  const isChosung = [...q].every(ch => JAMO_SET.has(ch));
  if (isChosung) {
    return allStations
      .filter(s => extractChosung(s).includes(q))
      .sort((a, b) => (extractChosung(a).startsWith(q) ? 0 : 1) - (extractChosung(b).startsWith(q) ? 0 : 1))
      .slice(0, 6);
  }
  return allStations
    .filter(s => s.includes(q))
    .sort((a, b) => (a.startsWith(q) ? 0 : 1) - (b.startsWith(q) ? 0 : 1))
    .slice(0, 6);
}

function MatchText({ text, query }) {
  const q = query.replace(/역$/, '');
  if (!q || [...q].every(ch => JAMO_SET.has(ch))) return React.createElement(React.Fragment, null, text);
  const idx = text.indexOf(q);
  if (idx === -1) return React.createElement(React.Fragment, null, text);
  return React.createElement(React.Fragment, null,
    text.slice(0, idx),
    React.createElement('mark', null, text.slice(idx, idx + q.length)),
    text.slice(idx + q.length)
  );
}

/* ── StationInput ── */
function StationInput({ value, onChange, onStart, allStations }) {
  const [activeIdx, setActiveIdx] = useState(0);
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);
  const prevNoMatch = useRef(false);

  const filtered = getMatches(value, allStations);
  const showDropdown = filtered.length > 0 && filtered[0] !== value;
  const noMatch = value.trim() !== '' && filtered.length === 0;

  function handleSelect(name) { onChange(name); setActiveIdx(0); }

  function handleChange(e) {
    const v = e.target.value;
    onChange(v);
    setActiveIdx(0);
    const hasNoMatch = v.trim() !== '' && getMatches(v, allStations).length === 0;
    if (hasNoMatch && !prevNoMatch.current) {
      setShake(false);
      requestAnimationFrame(() => setShake(true));
    }
    prevNoMatch.current = hasNoMatch;
  }

  function handleKey(e) {
    if (!showDropdown) { if (e.key === 'Enter') onStart(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIdx(i => (i + 1) % filtered.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx(i => i <= 0 ? filtered.length - 1 : i - 1); }
    else if (e.key === 'Enter') handleSelect(filtered[activeIdx]);
    else if (e.key === 'Escape') setActiveIdx(0);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="input-card">
        <p className="input-card-label">지금 어디 있어?</p>
        <div className="input-wrap">
          <input
            ref={inputRef}
            className={`station-input${noMatch ? ' station-input--error' : ''}${shake ? ' station-input--shake' : ''}`}
            onAnimationEnd={() => setShake(false)}
            type="text"
            placeholder="출발역 입력"
            value={value}
            onChange={handleChange}
            onKeyDown={handleKey}
            autoComplete="off"
          />
          {showDropdown && (
            <ul className="autocomplete">
              {filtered.map((name, i) => (
                <li
                  key={name}
                  className={i === activeIdx ? 'active' : ''}
                  onMouseDown={e => { e.preventDefault(); handleSelect(name); }}
                >
                  <MatchText text={name} query={value} />
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>
      <button
        className="btn-primary"
        onClick={onStart}
        disabled={!value.trim()}
      >
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM6 5.5l4 2.5-4 2.5V5.5z" fill="currentColor"/>
        </svg>
        운명에 맡기기
      </button>
    </div>
  );
}

/* ── ResultSteps ── */
const DIR_LABEL = { up: '상행 ↑', down: '하행 ↓' };

function StepCard({ step, variant, delay }) {
  const style = {
    '--step-color': step.color,
    animationDelay: `${delay}ms`,
  };
  const cls = [
    'step-card',
    variant === 'active' ? 'step-card--active' : '',
    variant === 'done' ? 'step-card--done' : '',
    variant === 'destination' ? 'step-card--destination' : '',
  ].filter(Boolean).join(' ');

  return (
    <div className={cls} style={style}>
      <span className="step-eyebrow">{step.label}</span>
      <span className="step-value">{step.value}</span>
      {step.sub && <span className="step-sub">{step.sub}</span>}
      {step.badge && (
        <div className="line-badge" style={{ background: step.color + '18', color: step.color, marginTop: 8 }}>
          <span className="line-dot" style={{ background: step.color }}></span>
          {step.badge}
        </div>
      )}
    </div>
  );
}

function ResultSteps({ result, currentStep, isRunning, maxStops, onMaxStopsChange, onNext, onReset }) {
  const { lineName, lineColor, boarding, direction, directionStats, destination } = result;

  const steps = [
    {
      label: '호선',
      value: lineName,
      sub: boarding.matched ? null : `출발역이 ${lineName}에 없어 가장 가까운 역으로 이동`,
      badge: boarding.name,
      color: lineColor,
    },
    {
      label: '방향',
      value: DIR_LABEL[direction],
      sub: `${boarding.name}역 기준`,
      color: lineColor,
    },
    destination && {
      label: '목적지',
      value: destination.name,
      sub: `${lineName} · ${DIR_LABEL[direction]}`,
      color: lineColor,
    },
  ].filter(Boolean);

  const done = currentStep >= 2 && !isRunning;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {/* Step cards */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {steps.slice(0, currentStep + 1).map((step, i) => {
          let variant = 'done';
          if (i === currentStep && !done) variant = 'active';
          if (i === 2 && done) variant = 'destination';
          return <StepCard key={i} step={step} variant={variant} delay={i * 40} />;
        })}
      </div>

      {/* Direction extras */}
      {isRunning && currentStep === 1 && (
        <div className="direction-extras">
          <div className="direction-counts">
            <div className="direction-stat">
              <span className="direction-stat-label">상행 최대</span>
              <span className="direction-stat-value">{directionStats.upCount} <span style={{fontSize:12,fontWeight:500,color:'var(--fg-tertiary)'}}>정거장</span></span>
            </div>
            <div className="direction-divider"></div>
            <div className="direction-stat">
              <span className="direction-stat-label">하행 최대</span>
              <span className="direction-stat-value">{directionStats.downCount} <span style={{fontSize:12,fontWeight:500,color:'var(--fg-tertiary)'}}>정거장</span></span>
            </div>
          </div>
          <div className="maxstops-row">
            <label className="maxstops-label" htmlFor="maxstops">최대 정거장</label>
            <input
              id="maxstops"
              className="maxstops-input"
              type="number"
              min="1"
              max={direction === 'up' ? directionStats.upCount : directionStats.downCount}
              value={maxStops}
              onChange={e => onMaxStopsChange(e.target.value)}
              placeholder="제한 없음"
            />
          </div>
        </div>
      )}

      {/* Action buttons */}
      {isRunning && (
        <button className="btn-primary" onClick={onNext}>
          {currentStep === 0 ? '방향 뽑기' : '목적지 뽑기'}
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{marginLeft:4}}>
            <path d="M3 7h8M7 3l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      )}
      
    </div>
  );
}

/* ── Confetti Canvas ── */
function ConfettiCanvas({ color }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    // parse line color → lighter variants
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return [r,g,b];
    }
    const [r,g,b] = hexToRgb(color || '#15C5CE');
    const palette = [
      `rgba(255,255,255,0.9)`,
      `rgba(${r},${g},${b},0.6)`,
      `rgba(255,255,255,0.6)`,
      `rgba(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)},0.8)`,
      `rgba(255,255,255,0.4)`,
    ];

    const pieces = Array.from({length: 80}, () => ({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 200,
      w: 6 + Math.random() * 8,
      h: 3 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.12,
      vx: (Math.random() - 0.5) * 2.5,
      vy: 2.5 + Math.random() * 3.5,
      color: palette[Math.floor(Math.random() * palette.length)],
    }));

    let raf;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotV;
        p.vy += 0.04;
        if (p.y > canvas.height + 20) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
          p.vy = 2.5 + Math.random() * 3.5;
        }
      });
      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(raf);
  }, [color]);

  return <canvas ref={canvasRef} className="confetti-canvas" style={{width:'100%',height:'100%'}} />;
}

/* ── Destination Screen ── */
function DestinationScreen({ destination, result, onReset }) {
  const { lineName, lineColor, direction } = result;
  const DIR_LABEL_SHORT = { up: '상행 ↑', down: '하행 ↓' };

  // 문 색상 — 호선 컬러보다 약간 어둡게
  const doorColor = lineColor;

  return (
    <div className="dest-screen" style={{ background: lineColor }}>
      {/* 지하철 문 패널 */}
      <div className="door-left" style={{ background: doorColor, filter: 'brightness(0.82)' }}>
        <div className="door-inner-line" />
        {/* 문 세로 손잡이 디테일 */}
        <div style={{
          position: 'absolute', top: '50%', right: 12,
          transform: 'translateY(-50%)',
          width: 4, height: 48, borderRadius: 2,
          background: 'rgba(0,0,0,0.18)',
        }} />
      </div>
      <div className="door-right" style={{ background: doorColor, filter: 'brightness(0.82)' }}>
        <div className="door-inner-line" />
        <div style={{
          position: 'absolute', top: '50%', left: 12,
          transform: 'translateY(-50%)',
          width: 4, height: 48, borderRadius: 2,
          background: 'rgba(0,0,0,0.18)',
        }} />
      </div>

      <ConfettiCanvas color={lineColor} />

      <div className="dest-content">
        <p className="dest-eyebrow">오늘의 목적지</p>
        <h1 className="dest-station">{destination.name}</h1>
        <div className="dest-line-badge">
          <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#fff', display: 'inline-block' }}></span>
          {lineName} · {DIR_LABEL_SHORT[direction]}
        </div>
        <button className="dest-again-btn" onClick={onReset}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1.5 7a5.5 5.5 0 1010.5-2.3M1.5 4v3h3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          다시 뽑기
        </button>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App() {
  const [departure, setDeparture] = useState('');
  const [result, setResult] = useState(null);
  const [currentStep, setCurrentStep] = useState(-1);
  const [isRunning, setIsRunning] = useState(false);
  const [maxStops, setMaxStops] = useState('');
  const [allStations, setAllStations] = useState([]);
  const [stationsData, setStationsData] = useState(null);
  const [stationsIdx, setStationsIdx] = useState(null);

  useEffect(() => {
    loadStations().then(data => {
      const idx = buildIndex(data);
      setStationsData(data);
      setStationsIdx(idx);
      setAllStations(getAllStationNames(idx));
    });
  }, []);

  function handleStart() {
    if (!departure.trim() || !stationsData) return;
    const lineId = pickRandomLine(stationsData);
    const lineInfo = stationsData.lines[lineId];
    const boarding = findNearestStation(departure, lineId, stationsIdx, stationsData);
    const direction = Math.random() < 0.5 ? 'up' : 'down';
    const directionStats = getDirectionStats(lineId, boarding.name, stationsData);
    setResult({ lineId, lineName: lineInfo.name, lineColor: lineInfo.color, boarding, direction, directionStats, destination: null });
    setCurrentStep(0);
    setIsRunning(true);
    setMaxStops('');
  }

  function handleNextStep() {
    if (currentStep === 1) {
      const dest = pickDestination(result.lineId, result.boarding.name, result.direction, maxStops ? parseInt(maxStops, 10) : null, stationsData);
      setResult(r => ({ ...r, destination: dest }));
    }
    if (currentStep < 2) setCurrentStep(p => p + 1);
    else setIsRunning(false);
  }

  function handleReset() {
    setResult(null); setCurrentStep(-1); setIsRunning(false); setDeparture(''); setMaxStops('');
  }

  const done = currentStep >= 2 && !isRunning;

  const appContent = (
    <div className="app-shell" style={{ position: 'relative' }}>
      <header className="app-header">
        <p className="header-eyebrow">Random Subway Trip</p>
        <h1 className="header-title">어디로<br /><span>떠날까</span></h1>
      </header>
      <main className="app-main">
        {!stationsData && (
          <div style={{ color: 'var(--fg-tertiary)', fontSize: 13, textAlign: 'center', paddingTop: 20 }}>역 데이터 로딩 중…</div>
        )}
        {stationsData && currentStep === -1 && (
          <StationInput
            value={departure}
            onChange={setDeparture}
            onStart={handleStart}
            allStations={allStations}
          />
        )}
        {stationsData && currentStep >= 0 && (
          <ResultSteps
            result={result}
            currentStep={currentStep}
            isRunning={isRunning}
            maxStops={maxStops}
            onMaxStopsChange={setMaxStops}
            onNext={handleNextStep}
            onReset={handleReset}
          />
        )}
      </main>
      {done && result?.destination && (
        <DestinationScreen
          destination={result.destination}
          result={result}
          onReset={handleReset}
        />
      )}
    </div>
  );

  return (
    <IOSDevice width={390} height={844} dark={false}>
      {appContent}
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
